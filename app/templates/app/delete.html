{% extends 'app/base.html' %}

{% block content %}

<h1>🗑 Delete Student</h1>

<p>Are you sure you want to delete this student?</p>

<h3>{{ student.name }}</h3>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

</form>

<br>

<a href="/students/">
    Cancel
</a>

{% endblock %}
