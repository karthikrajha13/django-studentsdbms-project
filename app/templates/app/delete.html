{% extends "app/base.html" %} {% block content %}

<div class="row justify-content-center py-5">
  <div class="col-lg-6 col-md-8">
    <div class="card shadow-lg border-0 rounded-4">
      <div class="card-body text-center p-5">
        <i class="bi bi-trash-fill text-danger" style="font-size: 70px"></i>

        <h2 class="fw-bold mt-3">Delete Student</h2>

        <p class="text-muted">Are you sure you want to delete this student?</p>

        <div class="alert alert-light border">
          <h4 class="fw-bold mb-2">{{ student.name }}</h4>

          <p class="mb-1">
            <strong>Email:</strong>
            {{ student.email }}
          </p>

          <p class="mb-0">
            <strong>Course:</strong>
            {{ student.course }}
          </p>
        </div>

        <form method="POST">
          {% csrf_token %}

          <div class="d-flex justify-content-center gap-3 mt-4">
            <a href="{% url 'students' %}" class="btn btn-secondary">
              <i class="bi bi-arrow-left"></i>

              Cancel
            </a>

            <button type="submit" class="btn btn-danger">
              <i class="bi bi-trash-fill"></i>

              Delete Student
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
