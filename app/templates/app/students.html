{% extends 'app/base.html' %} {% block content %}

<h1>📋 Student List</h1>

<table border="1" cellpadding="10">
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Age</th>
    <th>Course</th>
    <th>Action</th>
  </tr>

  {% for student in students %}

  <tr>
    <td>{{ student.id }}</td>

    <td>{{ student.name }}</td>

    <td>{{ student.email }}</td>

    <td>{{ student.age }}</td>

    <td>{{ student.course }}</td>
    <td>
      <a href="/edit/{{ student.id }}/">Edit</a> |
      <a href="/delete/{{ student.id }}/">Delete</a>
    </td>
  </tr>

  {% endfor %}
</table>

{% endblock %}
