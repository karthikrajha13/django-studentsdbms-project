{% extends "app/base.html" %}

{% block content %}

<div class="container mt-5" style="max-width:600px;">

    <h2 class="mb-4 text-primary">Login</h2>

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <label>Username</label>
            <input
                type="text"
                class="form-control"
                name="username"
                required
            >
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input
                type="password"
                class="form-control"
                name="password"
                required
            >
        </div>

        <button class="btn btn-primary">
            Login
        </button>

    </form>

</div>

{% endblock %}
