{% extends "app/base.html" %}

{% load crispy_forms_tags %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">Student Registration</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form|crispy }}

        <button class="btn btn-primary">
            Register Student
        </button>

    </form>

</div>

{% endblock %}
